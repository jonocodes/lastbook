# Prototype Flatpak for Lastbook (https://github.com/Immortal-Protocols/lastbook).
# Builds the same /opt/lastbook tree as packaging/linux/build_app_linux.sh, rooted at /app/lastbook, on the GNOME runtime,
# which supplies Python 3.14, PyGObject, GTK 3, WebKitGTK 4.1 and GStreamer (dav1d; H.264 through codecs-extra).
# Every source is pinned by commit or SHA-256, so the build needs no network.
#
#   flatpak-builder --user --install --force-clean build org.lastbook.Lastbook.yml
#   flatpak run org.lastbook.Lastbook [--data /path/to/LastbookData]
app-id: org.lastbook.Lastbook
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: lastbook
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri            # WebKit's drawing; Vulkan for the local AI runner
  - --socket=pulseaudio     # sound for videos
  - --share=network         # setup's downloads and the Check for updates button only (ALLOWED_HOSTS, pinned roots)
modules:
  - name: lastbook
    buildsystem: simple
    build-commands:
      # web/ and content/ as they ship (stdlib only)
      - python3 -I -B packaging/ship_app_files.py ship
      - install -d /app/lastbook/app /app/lastbook/engine/setup /app/lastbook/setup /app/lastbook/lib /app/lastbook/gst
      # program files: the list in build_app_linux.sh
      - cp app/main.py app/bridge.py app/shell_linux.py app/ui_language.py /app/lastbook/app/
      - cp server.py retrieval.py assistant.py llm_local.py packaging/linux/lastbook.py /app/lastbook/
      - cp engine/__init__.py engine/paths.py engine/library.py engine/safe_paths.py engine/encyclopedias.py engine/saved_pages.py
        engine/address_search.py engine/page_tables.py engine/update.py engine/notes.py /app/lastbook/engine/
      - cp engine/setup/*.py engine/setup/roots.pem /app/lastbook/engine/setup/
      - cp -R ship/web ship/content /app/lastbook/
      - cp manifest-v1.json /app/lastbook/setup/
      - echo 1.1.15 > /app/lastbook/VERSION
      # the pinned wheels, from the sources below, for the runtime's Python
      - 'pip3 install --no-index --no-deps --only-binary=:all: --no-compile --target /app/lastbook/lib wheels/*.whl'
      - rm -rf /app/lastbook/lib/bin /app/lastbook/lib/numpy/tests /app/lastbook/lib/numpy/_core/tests /app/lastbook/lib/numpy/f2py
        /app/lastbook/lib/numpy/testing /app/lastbook/lib/pypdfium2_cli
      - find /app/lastbook/lib -depth \( -name tests -o -name testing -o -name __pycache__ \) -type d -exec rm -rf {} +
      # lastbooksrc: the GStreamer source for lastbook://app/videos/
      - gcc -shared -fPIC -O2 -Wall -Werror -s packaging/linux/gst/lastbooksrc.c -o /app/lastbook/gst/libgstlastbooksrc.so
        $(pkg-config --cflags --libs gstreamer-1.0 gstreamer-base-1.0)
      - python3 -I -m compileall -q -j 0 /app/lastbook
      # launcher, menu entry, icon, metainfo
      - install -d /app/bin
      - printf '#!/bin/sh\nexec /usr/bin/python3 -I -B /app/lastbook/lastbook.py "$@"\n' > /app/bin/lastbook
      - chmod 755 /app/bin/lastbook
      - sed -e 's|^Exec=.*|Exec=lastbook|' -e 's|^Icon=.*|Icon=org.lastbook.Lastbook|' packaging/linux/lastbook.desktop
        | install -Dm644 /dev/stdin /app/share/applications/org.lastbook.Lastbook.desktop
      - install -Dm644 org.lastbook.Lastbook.png /app/share/icons/hicolor/512x512/apps/org.lastbook.Lastbook.png
      - install -Dm644 org.lastbook.Lastbook.metainfo.xml /app/share/metainfo/org.lastbook.Lastbook.metainfo.xml
    sources:
      - type: git
        url: https://github.com/Immortal-Protocols/lastbook.git
        tag: v1.1.15
        commit: bb307c8766425087e5e62766190b264b360a4e04
      - type: file
        path: manifest-v1.json          # the setup manifest; release builds make it with packaging/release_manifest.py
      - type: file
        path: org.lastbook.Lastbook.metainfo.xml
      - type: file
        path: org.lastbook.Lastbook.png   # packaging/icon/tile-1024.png at 512 px (Flatpak takes up to 512)
      # requirements_linux.txt pins, plus what they depend on
      - type: file
        dest: wheels
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/31/f3/16820fa6041ecbf6c6b54d1b3dcc23e3489f71447870f36a3d2779092434/libzim-3.13.1-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
